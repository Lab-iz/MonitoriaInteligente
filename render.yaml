services:
  - type: web
    name: monitoria-inteligente
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_INIT_DB
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: SQLITE_DB_PATH
        value: /tmp/monitoria.db
      - key: UPLOAD_FOLDER
        value: /tmp/monitoria-uploads
      - key: REPORT_FOLDER
        value: /tmp/monitoria-reports
